[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etl"
version = "0.1.0"
description = "Example PySpark 4.x project skeleton with Delta Lake 4.2.x, Click CLI, and Pytest fixtures"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Zheng Zhu", email = "zzhu8192@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.10.6",
    "rich>=14.0.0",
    "python-dotenv>=1.1.1"
]

[dependency-groups]
test = [
    "delta-spark>=4.2.0",
    "pyspark>=4.0.1",
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "filelock>=3.12.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0",
    "grpcio>=1.62.0",
    "grpcio-status>=1.62.0"
]

[project.scripts]
main = "etl.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
main = [
    "resources/**/*"
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportOptionalMemberAccess = true

[tool.pytest.ini_options]
log_level = "WARNING"
log_cli_level = "WARNING"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
