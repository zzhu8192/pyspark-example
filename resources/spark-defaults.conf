#
# Spark configurations
#
spark.sql.catalogImplementation  hive
spark.sql.adaptive.enabled true
spark.sql.parquet.compression.codec gzip


#
# metastore  (REMOTE DPMS)
#   will require ssh tunneling
#
#spark.hadoop.hive.metastore.uris=thrift://localhost:9083
#spark.sql.warehouse.dir  gs://gcs-bucket-data-dpms-thrift-poc-2af81141-31a4-41e2-97b9-d83c26c/hive-warehouse
#
# metastore (LOCAL)  enabled by default
#
spark.sql.warehouse.dir  /hive/db


